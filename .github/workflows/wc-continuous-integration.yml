---
name: Continuous Integration

on:
  workflow_call:
    inputs:
      target:
        description: "Target"
        required: true
        type: string
      configuration:
        description: "Configuration"
        required: true
        type: string

permissions: {}

jobs:
  build:
    name: Build
    runs-on: [ubuntu-latest]
    container: ghcr.io/philips-software/amp-devcontainer-cpp:v6.0.2@sha256:36afaaa5ba4bc4e9bb471012db9733c26a210e315ddb33600f73bb9532b02a25 # 6.0.2
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          disable-sudo-and-containers: true
          egress-policy: audit
      - uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        if: ${{ inputs.target == 'windows' }}
        id: cache-winsdk
        with:
          path: /winsdk
          key: cache-winsdk
      - if: ${{ inputs.target == 'windows' && steps.cache-winsdk.outputs.cache-hit != 'true' }}
        run: xwin --accept-license --sdk-version "10.0.26100" --crt-version "14.43.17.13" splat --preserve-ms-arch-notation --include-debug-libs && mv .xwin-cache/splat/ /winsdk
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: true
      - uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          key: ${{ inputs.target}}-${{ inputs.configuration }}
      - uses: lukka/run-cmake@5d55ea7949e25f69f0ecb516d8d572297e03a956 # v10.9
        with:
          configurePreset: "${{ inputs.target }}"
          buildPreset: "${{ inputs.target }}-${{ inputs.configuration }}"
          configurePresetAdditionalArgs: "['-DCMAKE_C_COMPILER_LAUNCHER=ccache', '-DCMAKE_CXX_COMPILER_LAUNCHER=ccache']"
      - if: ${{ inputs.target == 'host' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: HostInstall
          path: ${{ github.workspace }}/build/host/Postmaster-*-Linux.tar.gz
      - if: ${{ inputs.target == 'windows' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: WindowsDiscovery
          path: ${{ github.workspace }}/build/**/*.exe
          retention-days: 8
      - if: ${{ inputs.target == 'stm32f407' && inputs.configuration == 'RelWithDebInfo' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: postmaster
          path: build/stm32f407/Postmaster-*-Generic-ELF.tar.gz
          if-no-files-found: error
